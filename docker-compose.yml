services:
  server:
    container_name: cybermp-gamemode-prod
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      IS_DOCKER: "true"
    stdin_open: true
    tty: true
    volumes:
      - ./cache:/cybermp/cache
      - ./crashdumps:/cybermp/crashdumps
      - ./logs:/cybermp/logs
    ports:
      - ${PORT:-2077}:2077/tcp
      - ${PORT:-2077}:2077/udp
